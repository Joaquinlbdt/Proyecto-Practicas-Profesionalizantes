<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Adopciones MIAU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-top">
        <div class="header-content">
            <div class="brand">
                <span class="brand-text">Adopciones MIAU</span>
                <span class="pata-icon">🐾</span>
            </div>
            <div class="header-right">
                <a href="login.html" class="btn btn-primary">Iniciar sesión</a>
                <a href="registro.html" class="btn btn-secondary">Registrarse</a>
            </div>
        </div>
    </header>

    <nav class="nav-bar">
    <div class="nav-links">
        <a href="index.html" class="nav-item">Adoptame</a>
        <a href="testimonios.html" class="nav-item">Testimonio</a>
        <a href="faq.html" class="nav-item">Preguntas Frecuentes</a>
        <a href="contacto.html" class="nav-item">Contacto</a>
        <a href="agregar-mascota.html" class="nav-item">Publicar Mascota</a>
    </div>
    <div class="search-box">
        <input type="text" placeholder="Buscar...">
        <button class="search-btn">🔍</button>
    </div>
</nav>

    <main class="main-container layout-two-cols">
        <!-- Info de Contacto -->
        <section class="contact-info">
            <div class="hours-box">
                <p><strong>Lunes - Viernes</strong><br>9am - 6pm</p>
                <hr>
                <p><strong>Sábados</strong><br>9am - 2pm</p>
            </div>

            <div class="location-box">
                <h3>Ubicación</h3>
                <p>adopcionesmiau@gmail.com</p>
                <p>mmboe</p>
            </div>

            <div class="wsp-box">
                <h3>Recibe asesoría</h3>
                <a href="https://wa.me/" class="wsp-large-btn" target="_blank">🟢</a>
            </div>
        </section>

        <!-- Formulario rosa -->
        <section class="pink-form-card">
            <h2>Contactanos</h2>
            <form action="#" method="POST">
                <div class="form-group">
                    <label>Nombre Completo*</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Correo*</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Mensaje*</label>
                    <textarea rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-send">Enviar Mensaje</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <p>Copyright by Fernando Pérez</p>
            <div class="social-icons">
                <a href="#">🌐</a><a href="#">📷</a><a href="#">🐦</a><a href="#">▶</a>
            </div>
            <p>Carrera 53a #43 161 Piso 7</p>
        </div>
    </footer>

<script src="script.js"></script>
</body>
</html>
