<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonios - Adopciones MIAU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABECERA PRINCIPAL -->
    <header class="header-top">
        <div class="header-content">
            <div class="brand">
                <span class="brand-text">Adopciones MIAU</span>
                <span class="pata-icon">🐾</span>
            </div>
            <div class="header-right">
                <a href="login.html" class="btn btn-primary">Iniciar sesión</a>
                <a href="registro.html" class="btn btn-secondary">Registrarse</a>
            </div>
        </div>
    </header>

    <!-- NAVEGACIÓN -->
    <nav class="nav-bar">
        <div class="nav-links">
            <a href="index.html" class="nav-item">Adoptame</a>
            <a href="testimonios.html" class="nav-item active">Testimonio</a>
            <a href="contacto.html" class="nav-item">Contacto</a>
        </div>
        <div class="search-box">
            <input type="text" placeholder="Buscar...">
            <button class="search-btn">🔍</button>
        </div>
    </nav>

    <!-- CONTENIDO TESTIMONIOS -->
    <main class="main-container layout-two-cols">

        <!-- Lista de testimonios (Izquierda): la dibuja script.js desde localStorage -->
        <section class="testimonials-list" id="lista-testimonios"></section>

        <!-- Formulario rosa (Derecha) -->
        <section class="pink-form-card">
            <h2>Te invitamos a que compartas tu testimonio!</h2>
            <form id="form-testimonio">
                <div class="form-group">
                    <label for="testimonio-nombre">Nombre de la mascota*</label>
                    <input type="text" id="testimonio-nombre" maxlength="40" required>
                </div>
                <div class="form-group">
                    <label for="testimonio-texto">Testimonio*</label>
                    <textarea id="testimonio-texto" rows="5" maxlength="600" required></textarea>
                </div>

                <img id="testimonio-vista-previa" class="vista-previa" alt="Vista previa de la foto" hidden>
                <!-- Este input está oculto: lo abre el botón "Adjunta foto" -->
                <input type="file" id="testimonio-foto" accept="image/*" hidden>

                <div class="form-actions-inline">
                    <button type="button" class="btn-attach" id="btn-adjuntar">Adjunta foto 📷</button>
                    <button type="submit" class="btn-send" id="btn-enviar-testimonio">Enviar Testimonio</button>
                </div>
                <p class="ayuda">Necesitás iniciar sesión para enviarlo. La foto es opcional.</p>
            </form>
        </section>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer>
        <div class="footer-content">
            <p>Copyright by Fernando Pérez</p>
            <div class="social-icons">
                <a href="#">🌐</a><a href="#">📷</a><a href="#">🐦</a><a href="#">▶</a>
            </div>
            <p>Carrera 53a #43 161 Piso 7</p>
        </div>
    </footer>

<script src="script.js"></script>
</body>
</html>
