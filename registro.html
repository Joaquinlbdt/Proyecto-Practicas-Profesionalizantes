<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Adopciones MIAU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <!-- CABECERA -->
    <header class="header-top">
        <div class="header-content">
            <div class="brand">
                <span class="brand-text">Adopciones MIAU</span>
                <span class="pata-icon">🐾</span>
            </div>
            <div class="header-right">
                <a href="login.html" class="btn btn-primary">Iniciar sesión</a>
                <a href="registro.html" class="btn btn-secondary">Registrarse</a>
            </div>
        </div>
    </header>

    <!-- NAV BAR -->
    <nav class="nav-bar">
        <div class="nav-links">
            <a href="index.html" class="nav-item">Adoptame</a>
            <a href="testimonios.html" class="nav-item">Testimonio</a>
            <a href="contacto.html" class="nav-item">Contacto</a>
        </div>
    </nav>

    <!-- CONTENIDO REGISTRO -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-image">
                <img src="https://images.unsplash.com/photo-1548767797-d8c844163c4c?q=80&w=600" alt="Mascotas">
            </div>
            <div class="auth-form-side">
                <div class="auth-cat-icon">🐱</div>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="reg-username">Nombre de usuario</label>
                        <input type="text" id="reg-username" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Correo</label>
                        <input type="email" id="reg-email" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-telefono">Teléfono / WhatsApp</label>
                        <input type="tel" id="reg-telefono" placeholder="Ej: 11 2345 6789" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Contraseña (mínimo 6 caracteres)</label>
                        <input type="password" id="reg-password" required>
                    </div>
                    <button type="submit" class="btn-auth-submit">Registrarse</button>
                    <p style="color: white; font-size: 0.85rem; margin-top: 10px; text-align: center;">
                        ¿Ya tienes cuenta? <a href="login.html" style="color: #fff; font-weight: bold;">Inicia sesión aquí</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <p>Copyright by Fernando Pérez</p>
            <div class="social-icons">
                <a href="#">🌐</a><a href="#">📷</a><a href="#">🐦</a><a href="#">▶</a>
            </div>
            <p>Carrera 53a #43 161 Piso 7</p>
        </div>
    </footer>

<script src="script.js"></script>
</body>
</html>
