<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Adopciones MIAU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <!-- CABECERA -->
    <header class="header-top">
        <div class="header-content">
            <div class="brand">
                <span class="brand-text">Adopciones MIAU</span>
                <span class="pata-icon">🐾</span>
            </div>
            <div class="header-right">
                <a href="login.html" class="btn btn-primary">Iniciar sesión</a>
                <a href="registro.html" class="btn btn-secondary">Registrarse</a>
            </div>
        </div>
    </header>

    <!-- NAV BAR -->
    <nav class="nav-bar">
    <div class="nav-links">
        <a href="index.html" class="nav-item">Adoptame</a>
        <a href="testimonios.html" class="nav-item">Testimonio</a>
        <a href="faq.html" class="nav-item">Preguntas Frecuentes</a>
        <a href="contacto.html" class="nav-item">Contacto</a>
        <a href="agregar-mascota.html" class="nav-item">Publicar Mascota</a>
    </div>
    <div class="search-box">
        <input type="text" placeholder="Buscar...">
        <button class="search-btn">🔍</button>
    </div>
</nav>
    <!-- CONTENIDO LOGIN -->
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-image">
                <img src="https://images.unsplash.com/photo-1548767797-d8c844163c4c?q=80&w=600" alt="Mascotas">
            </div>
            <div class="auth-form-side">
                <div class="auth-cat-icon">🐱</div>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label>Correo</label>
                        <input type="email" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" required>
                    </div>
                    <button type="submit" class="btn-auth-submit">Iniciar sesión</button>
                    <p style="color: white; font-size: 0.85rem; margin-top: 10px; text-align: center;">
                        ¿No tienes cuenta? <a href="registro.html" style="color: #fff; font-weight: bold;">Regístrate aquí</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="footer-content">
            <p>Copyright by Fernando Pérez</p>
            <div class="social-icons">
                <a href="#">🌐</a><a href="#">📷</a><a href="#">🐦</a><a href="#">▶</a>
            </div>
            <p>Carrera 53a #43 161 Piso 7</p>
        </div>
    </footer>

<script src="script.js"></script>
</body>
</html>
